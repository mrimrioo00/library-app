{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <a href="/books" class="text-decoration-none mb-3 d-inline-block">← 一覧に戻る</a>
    <h2 class="mt-3">📖 本を登録する</h2>

    <!-- ISBN自動登録 -->
    <div class="card mt-4">
        <div class="card-header">🔍 ISBNで自動登録（おすすめ）</div>
        <div class="card-body">
            <p class="text-muted">本の裏表紙にあるバーコードの数字を入力してください</p>
            <form id="isbn-form">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <input type="text" id="isbn-input" class="form-control"
                               placeholder="例: 9784873117584" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <select id="isbn-owner" class="form-select">
                            <option value="">提供者（任意）</option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <button type="submit" class="btn btn-primary w-100">検索して登録</button>
                    </div>
                </div>
            </form>
            <div id="isbn-result" class="mt-3" style="display:none;">
                <div class="alert alert-success">
                    ✅ 登録完了: <span id="isbn-result-title"></span>
                </div>
            </div>
            <div id="isbn-error" class="mt-3" style="display:none;">
                <div class="alert alert-danger" id="isbn-error-message"></div>
            </div>
        </div>
    </div>

    <!-- 手動登録 -->
    <div class="card mt-4">
        <div class="card-header">✏️ 手動で登録</div>
        <div class="card-body">
            <form id="manual-form">
                <div class="mb-3">
                    <label class="form-label">タイトル *</label>
                    <input type="text" id="manual-title" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">概要</label>
                    <textarea id="manual-desc" class="form-control" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">表紙画像URL</label>
                    <input type="text" id="manual-cover" class="form-control"
                           placeholder="https://...">
                </div>
                <div class="mb-3">
                    <label class="form-label">提供者</label>
                    <select id="manual-owner" class="form-select">
                        <option value="">選択なし</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success">登録する</button>
            </form>
        </div>
    </div>
</div>

<script>
    // ユーザー一覧をセレクトボックスに入れる
    fetch('/api/users')
        .then(res => res.json())
        .then(users => {
            ['isbn-owner', 'manual-owner'].forEach(id => {
                const select = document.getElementById(id);
                users.forEach(user => {
                    const option = document.createElement('option');
                    option.value = user.id;
                    option.textContent = user.name;
                    select.appendChild(option);
                });
            });
        });

    // ISBN登録
    document.getElementById('isbn-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const isbn = document.getElementById('isbn-input').value.trim();
        const ownerId = document.getElementById('isbn-owner').value;

        document.getElementById('isbn-result').style.display = 'none';
        document.getElementById('isbn-error').style.display = 'none';

        fetch('/api/books/isbn', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                isbn: isbn,
                owner_id: ownerId ? parseInt(ownerId) : null
            })
        })
        .then(res => {
            if (!res.ok) return res.json().then(err => { throw err; });
            return res.json();
        })
        .then(data => {
            document.getElementById('isbn-result-title').textContent = data.title;
            document.getElementById('isbn-result').style.display = 'block';
            document.getElementById('isbn-input').value = '';
        })
        .catch(err => {
            document.getElementById('isbn-error-message').textContent =
                err.detail || 'ISBNに対応する本が見つかりませんでした';
            document.getElementById('isbn-error').style.display = 'block';
        });
    });

    // 手動登録
    document.getElementById('manual-form').addEventListener('submit', (e) => {
        e.preventDefault();

        const ownerId = document.getElementById('manual-owner').value;

        fetch('/api/books', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                title: document.getElementById('manual-title').value,
                description: document.getElementById('manual-desc').value,
                cover_url: document.getElementById('manual-cover').value,
                owner_id: ownerId ? parseInt(ownerId) : null
            })
        })
        .then(res => {
            if (!res.ok) return res.json().then(err => { throw err; });
            return res.json();
        })
        .then(() => {
            alert('本を登録しました！');
            location.href = '/books';
        })
        .catch(err => alert('エラー: ' + (err.detail || '登録に失敗しました')));
    });
</script>
{% endblock %}
